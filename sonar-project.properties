# SonarQube Project Configuration
# P2P Electric Motorbike Rental System

# Project identification
sonar.projectKey=p2p-emrs
sonar.projectName=P2P Electric Motorbike Rental System
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src,test
sonar.inclusions=src/**/*.ts
sonar.exclusions=\
  src/**/*.spec.ts,\
  src/**/*.module.ts,\
  src/**/index.ts,\
  src/**/*.entity.ts,\
  src/**/*.dto.ts,\
  src/main.ts

# Duplication exclusions — generated/boilerplate files skew metrics
sonar.cpd.exclusions=\
  src/**/*.dto.ts,\
  src/**/*.entity.ts,\
  src/**/*.module.ts

# Test configuration
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.spec.ts,test/**/*.e2e-spec.ts

# Coverage reporting — LCOV generated by jest --coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language and encoding
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Quality gate
sonar.qualitygate.wait=true

# Performance — increase Node.js heap for large TS projects
sonar.javascript.node.maxoldspace=4096

# Analysis scope — limit to changed files on PRs (set by CI via sonar.pullrequest.* params)
# sonar.pullrequest.key=
# sonar.pullrequest.branch=
# sonar.pullrequest.base=
