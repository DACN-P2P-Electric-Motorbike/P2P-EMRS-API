# SonarQube Project Configuration
# P2P Electric Motorbike Rental System

# Project identification
sonar.projectKey=p2p-emrs
sonar.projectName=P2P Electric Motorbike Rental System
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src,test
sonar.inclusions=src/**/*.ts
sonar.exclusions=src/**/*.spec.ts,src/**/*.module.ts,src/**/index.ts

# Test configuration
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.spec.ts,test/**/*.e2e-spec.ts
#sonar.testExecutionReportPaths=test-results.xml

# Coverage reporting (for Jest/LCOV)
# SonarQube will read test coverage from LCOV format
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language and encoding
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Code analysis rules
sonar.qualitygate.wait=true

# Optimization
sonar.javascript.node.maxoldspace=4096
