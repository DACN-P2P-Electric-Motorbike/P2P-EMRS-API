name: Docker CI/CD - Docker Hub

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Run tests with coverage
        run: npm run test:cov

      - name: SonarQube Scan
        run: sonar-scanner

      - name: Checkout repository
        # Security: Pin to full commit SHA to prevent supply chain attacks
        # v4 points to the latest v4.x.x, but commits can be modified
        uses: actions/checkout@c85c95e3d7251135ab7dc9d055be0fb1f3039537 # v4.1.1

      - name: Set up Docker Buildx
        # Security: Pin to full commit SHA instead of version tag
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa601ebf42355a # v3.3.0

      - name: Log in to Docker Hub
        # Security: Pin to full commit SHA instead of version tag
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52ea9cf2b2f1b1 # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        # Security: Pin to full commit SHA instead of version tag
        uses: docker/metadata-action@8e5442c4ef9f78752691e7d7d0b67c9d60ce73f1 # v5.5.1
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/p2p-emrs
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch

      - name: Build and push to Docker Hub
        # Security: Pin to full commit SHA instead of version tag
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3e77a23c8c38c8 # v5.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runner
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/p2p-emrs:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/p2p-emrs:buildcache,mode=max
