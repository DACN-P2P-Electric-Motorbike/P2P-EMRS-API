name: Docker CI/CD - Docker Hub

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: 18
      
      - name: Install dependencies 
        run: npm install
      
      - name: Run tests with coverage
        run: npm run test:cov

      - name: SonarQube Scan
        run: sonar-scanner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/p2p-emrs
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runner
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/p2p-emrs:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/p2p-emrs:buildcache,mode=max
